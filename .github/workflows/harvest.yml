name: Harvest

# Test branch only. The production workflow remains unchanged on main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma_smoke:
    name: Gemma JSON API smoke test (no harvest or deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test three existing abstracts against the current API contract
        env:
          PYTHONPATH: pipeline
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          import evidence_digest.cloudflare_ai as cloudflare_ai

          if not os.environ.get('CLOUDFLARE_ACCOUNT_ID') or not os.environ.get('CLOUDFLARE_AI_TOKEN'):
              raise SystemExit('Cloudflare repository secrets are missing')
          wanted = {'42993728', '42994118', '42996469'}
          studies = {}
          for path in ('data/archive/2026-11-06.jsonl.gz', 'data/archive/2026-11-07.jsonl.gz'):
              with gzip.open(path, 'rt', encoding='utf-8') as source:
                  for line in source:
                      study = json.loads(line)
                      if str(study.get('pmid')) in wanted:
                          studies[str(study['pmid'])] = study
          if set(studies) != wanted:
              raise SystemExit(f'Test studies missing: {sorted(wanted - set(studies))}')
          cloudflare_ai.MODEL_ID = '@cf/google/gemma-4-26b-a4b-it'
          client = cloudflare_ai.CloudflareAIClient(
              os.environ['CLOUDFLARE_ACCOUNT_ID'], os.environ['CLOUDFLARE_AI_TOKEN']
          )
          for pmid in sorted(wanted):
              summary = client.summarize(studies[pmid])
              print(json.dumps({'pmid': pmid, **summary}, ensure_ascii=False))
          print('PASS: three API responses met the four-field Chinese JSON contract')
          PY
